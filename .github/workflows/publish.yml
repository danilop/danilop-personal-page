name: Verify deployment and publish short links
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notes-publication
  cancel-in-progress: false
jobs:
  publication-mode:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: mode
        run: node -e 'const c=require("./publishing/deployment.json");require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT,`enabled=${c.indexable}\n`)'
  publish-links:
    needs: publication-mode
    if: needs.publication-mode.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && vars.PUBLICATION_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --include=dev --cache .npm --prefer-offline
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PUBLICATION_ROLE_ARN }}
          aws-region: eu-west-1
      - run: npm run publish:links -- --apply --wait
      - run: npm run distribute -- --apply
        env:
          PUBLICATION_BUCKET: danilop-link
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: distribution-previews
          path: exports/distribution/
          if-no-files-found: ignore
          retention-days: 7
