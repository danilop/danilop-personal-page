    text: Figure two point one compares two schematic objective functions. The
      convex example forms one bowl, whose lowest point is both a local and a
      global minimum. The nonconvex example has several valleys at different
      heights; a local minimum need not be the global minimum. The horizontal
      axis represents the candidate solution and the vertical axis the objective
      value. Smoothness alone does not establish whether a local minimum is
      global.
