schemaVersion: 1
blocks:
  agent-handover:
    kind: diagram
    source:
      format: mermaid
      path: ./agent-handover.mmd
    caption: One history across tools. Claude Code records the fix; that night the dream adds it to the project page; a week later Codex finds the page and follows its source.
    description: A sequence with five participants. Claude Code records the fix and the setting as an episode in the journal. That night the dream reads new episodes and updates the project page in the wiki, citing the episode. A week later Codex searches the wiki for the deployment and receives the project page with the setting. It then follows the cited source to the journal, which returns the episode and how the setting was tested.
  hybrid-search:
    kind: diagram
    source:
      format: mermaid
      path: ./hybrid-search.mmd
    caption: Search. Keyword and meaning searches each rank the memories; the two rankings are merged before links lead to pages the question never named.
    description: A question goes to keyword search with SQLite FTS5 and to meaning search with EmbeddingGemma 2. Each returns a ranked list. Reciprocal rank fusion merges the two lists. From the best matches, and from the names the question mentions, search follows links to people, projects and their other names to produce the results.
  memory-lifecycle:
    kind: diagram
    source:
      format: mermaid
      path: ./memory-lifecycle.mmd
    caption: Memory lifecycle. Dreams connect recorded experiences with existing knowledge; a morning report and a grounding check flag edits that may have lost something.
    description: Experiences, notes and files are recorded, captured or transcribed into the journal and sources. The nightly dream takes new episodes from the journal and existing pages from the wiki, then updates and links the wiki. It also writes a morning report with a grounding check. Journal and wiki are indexed for local search. The dream uses that search to find related memories; agents use it in later tasks.
  memory-evaluation:
    kind: chart
    source:
      format: vega-lite
      path: ./memory-evaluation.vl.json
      data: ./memory-evaluation.csv
    render:
      web:
        plugin: vega-lite
        options: { width: 460, height: 160 }
      book:
        plugin: vega-lite
        options: { width: 460, height: 160 }
    caption: Evaluation results. One night of consolidation helped most on the hard test. On the held-out test, the raw journal did slightly better.
    description: A dot plot of the share of questions answered correctly, on an axis from 80 to 100 per cent. Standard test with a Sonnet reader and 28 episodes, raw journal 36 of 37 and after consolidation 37 of 37. Hard test with a Haiku reader limited to six turns and 178 episodes, raw journal 32 of 37 and after consolidation 37 of 37. Held-out test with a Haiku reader, raw journal 38 of 39 and after consolidation 37 of 39.
  shared-memory:
    kind: diagram
    source:
      format: mermaid
      path: ./shared-memory.mmd
    caption: Where it lives. AI tools reach the brain on the Raspberry Pi over Tailscale; a versioned store keeps a full copy on my Mac in sync.
    description: AI tools on my devices use MCP or the CLI over Tailscale to reach the brain service on a Raspberry Pi. The service includes local search. It reads and writes the team and personal spaces, which hold journals and wikis in Git. The nightly dream, also on the Raspberry Pi, sends journal context to a cloud model and applies wiki updates through MCP. The spaces sync with a versioned Amazon S3 store. The store syncs every minute with a full copy on my Mac.
