customHeaders:
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
  - pattern: 'build.json'
    headers:
      - key: Cache-Control
        value: no-store
  - pattern: '_astro/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: 'original-site/**/*'
    headers:
      - key: X-Robots-Tag
        value: noindex
