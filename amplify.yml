version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install --no-progress --skip-default-packages
        - nvm use
        - npm install --global "$(node -p 'require("./package.json").packageManager')"
        - sudo dnf install -y atk at-spi2-atk cups-libs gtk3 libXcomposite libXdamage libXrandr libxkbcommon mesa-libgbm nss alsa-lib
        - export PUPPETEER_CACHE_DIR="$PWD/.cache/puppeteer"
        - npm ci --include=dev --cache .npm --prefer-offline
    build:
      commands:
        - node --import tsx scripts/prepare.ts
        - npm run check
        - npm test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - cache/**/*
      - .cache/puppeteer/**/*
